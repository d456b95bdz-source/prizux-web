<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deep Core Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  padding: 60px 10%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.lab {
  max-width: 900px;
  margin-top: 100px;
}

.row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}

input {
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
  width: 120px;
}

button {
  padding: 12px 26px;
  border-radius: 999px;
  border: none;
  background: #111;
  color: #fff;
  cursor: pointer;
}

.progress {
  margin-top: 30px;
  height: 10px;
  background: #eee;
  border-radius: 999px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#22c55e,#ef4444);
}

.result {
  margin-top: 40px;
  font-size: 16px;
}
</style>
</head>

<body>

<section class="lab">
  <h1>Relationship Lab</h1>

  <div id="rows">
    <div class="row">
      <input class="x" placeholder="x">
    </div>
  </div>

  <button onclick="add()">Add x</button>

  <div style="margin-top:20px;">
    <input id="y" placeholder="y (target)">
  </div>

  <div style="margin-top:30px;">
    <button onclick="train()">Train</button>
  </div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="result" id="result"></div>
</section>

<script>
const API = "http://127.0.0.1:8000/train";

function add() {
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `<input class="x" placeholder="x">`;
  document.getElementById("rows").appendChild(div);
}

async function train() {
  const xs = [...document.querySelectorAll(".x")].map(i => Number(i.value));
  const y = Number(document.getElementById("y").value);
  const bar = document.getElementById("bar");

  bar.style.width = "0%";

  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      x: xs,
      y: y,
      epochs: 100,
      lr: 0.1
    })
  });

  let p = 0;
  const timer = setInterval(() => {
    p += 5;
    bar.style.width = p + "%";
    if (p >= 100) clearInterval(timer);
  }, 40);

  const data = await res.json();
  document.getElementById("result").innerHTML =
    `Best loss: ${data.best_loss.toFixed(4)}<br>
     Best epoch: ${data.best_epoch}`;
}
</script>

</body>
</html>
