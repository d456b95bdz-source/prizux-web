<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRIZUX Deep Core Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Plotly -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  padding: 60px 10%;
  background: #fff;
  color: #111;
}

h1 {
  font-size: 48px;
  margin-bottom: 30px;
}

/* ================= Controls ================= */
.controls {
  margin-bottom: 30px;
}

button {
  padding: 12px 22px;
  border-radius: 999px;
  border: none;
  background: #111;
  color: white;
  cursor: pointer;
  margin-right: 10px;
  transition: transform .15s ease, box-shadow .15s ease;
}

button.secondary {
  background: #f3f4f6;
  color: #111;
}

button:active {
  transform: scale(0.95);
}

/* ================= Cards ================= */
.card {
  border: 1px solid #e5e7eb;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: fadeIn .25s ease;
}

input {
  width: 80px;
  padding: 8px 10px;
  font-size: 14px;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
}

.label {
  font-size: 13px;
  color: #666;
}

/* ================= Progress ================= */
.progress {
  margin-top: 20px;
  height: 10px;
  background: #eee;
  border-radius: 5px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #4F46E5;
  transition: width .4s ease;
}

/* ================= Animation ================= */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<h1>Deep Core Lab</h1>

<div class="controls">
  <button onclick="addX()">+ Add X Dimension</button>
  <button class="secondary" onclick="addRow()">+ Add Row</button>
  <button onclick="train()">Train</button>
</div>

<div id="rows"></div>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<div id="lossChart" style="height:320px;margin-top:50px;"></div>
<div id="loss3d" style="height:520px;margin-top:50px;"></div>

<script>
/* =====================================================
   API CONFIG (전용 API 도메인)
===================================================== */
const API = "https://api.prizux.com/api";

/* =====================================================
   State
===================================================== */
let xDim = 1;

/* =====================================================
   Row Creation
===================================================== */
function createRow() {
  const row = document.createElement("div");
  row.className = "card";

  for (let i = 0; i < xDim; i++) {
    const input = document.createElement("input");
    input.type = "number";
    input.placeholder = "X" + (i + 1);
    row.appendChild(input);
  }

  const arrow = document.createElement("span");
  arrow.textContent = "→";
  arrow.className = "label";
  row.appendChild(arrow);

  const y = document.createElement("input");
  y.type = "number";
  y.placeholder = "Y";
  row.appendChild(y);

  document.getElementById("rows").appendChild(row);
}

/* =====================================================
   Add X Dimension
===================================================== */
function addX() {
  xDim++;

  document.querySelectorAll(".card").forEach(row => {
    const input = document.createElement("input");
    input.type = "number";
    input.placeholder = "X" + xDim;
    row.insertBefore(input, row.lastElementChild.previousSibling);
  });
}

/* =====================================================
   Add Row
===================================================== */
function addRow() {
  createRow();
}

/* =====================================================
   Train
===================================================== */
async function train() {
  const X = [];
  const Y = [];

  document.querySelectorAll(".card").forEach(row => {
    const inputs = row.querySelectorAll("input");
    const xs = [];

    for (let i = 0; i < xDim; i++) {
      const v = Number(inputs[i].value);
      if (isNaN(v)) return;
      xs.push(v);
    }

    const yv = Number(inputs[xDim].value);
    if (isNaN(yv)) return;

    X.push(xs);
    Y.push(yv);
  });

  if (X.length === 0) {
    alert("No valid data.");
    return;
  }

  const bar = document.getElementById("bar");
  bar.style.width = "15%";

  const res = await fetch(API + "/train", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ X, Y })
  });

  if (!res.ok) {
    alert("Training failed");
    return;
  }

  const data = await res.json();
  bar.style.width = "100%";

  /* ================= Loss Curve ================= */
  Plotly.newPlot("lossChart", [{
    y: data.loss_history,
    type: "scatter",
    mode: "lines",
    line: { color: "#4F46E5", width: 3 }
  }], {
    title: "Loss per Epoch",
    margin: { t: 40 },
    xaxis: { title: "Epoch" },
    yaxis: { title: "Loss" }
  });

  /* ================= 3D Loss Landscape ================= */
  Plotly.newPlot("loss3d", [
    {
      x: data.surface.w_grid,
      y: data.surface.b_grid,
      z: data.surface.loss_grid,
      type: "surface",
      colorscale: "RdYlGn",
      opacity: 0.9
    },
    {
      x: data.trajectory.map(p => p.w),
      y: data.trajectory.map(p => p.b),
      z: data.trajectory.map(p => p.loss),
      type: "scatter3d",
      mode: "lines+markers",
      line: { color: "#000", width: 4 },
      marker: { size: 3, color: "#000" }
    }
  ], {
    title: "Loss Landscape & Optimization Path",
    scene: {
      xaxis: { title: "Weight" },
      yaxis: { title: "Bias" },
      zaxis: { title: "Loss" }
    },
    margin: { t: 50 }
  });
}

/* =====================================================
   Init
===================================================== */
createRow();
</script>

</body>
</html>
