<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepCore Lab</title>
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
<style>
body { font-family: sans-serif; padding: 40px; }
textarea { width: 100%; height: 120px; }
button { padding: 12px 20px; }
#log { margin-top: 20px; }
</style>
</head>

<body>

<h1>DeepCore Lab</h1>

<p>
X 데이터는 예측에 사용하는 값, Y는 결과 값입니다.<br>
예시: 발사이즈·손크기 → 키 예측
</p>

<label>X (한 줄에 하나, 공백 구분)</label>
<textarea id="x">
25 18
26 19
27 20
</textarea>

<label>Y</label>
<textarea id="y">
170
175
180
</textarea>

<button onclick="start()">Train</button>

<div id="log"></div>
<div id="loss"></div>
<div id="surface"></div>

<script>
const API = "https://api.prizux.com"; // ← 반드시 서버 주소

function parse(text) {
  return text.trim().split("\n").map(
    r => r.trim().split(/\s+/).map(Number)
  );
}

function start() {
  const X = parse(x.value);
  const y = parse(y.value).flat();

  const sid = crypto.randomUUID();

  fetch(`${API}/train`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ session_id: sid, X, y, epochs: 50 })
  });

  const es = new EventSource(`${API}/train-stream?session_id=${sid}`);

  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.done) {
      log.innerHTML += "<b>Training complete</b>";
      es.close();
      return;
    }

    log.innerHTML = `Epoch ${d.epoch} | Loss ${d.loss.toFixed(4)}`;

    Plotly.newPlot("loss", [{
      y: [d.loss], mode:"lines+markers"
    }]);

    Plotly.newPlot("surface", [{
      z: d.surface.loss,
      x: d.surface.w,
      y: d.surface.b,
      type: "surface"
    }]);
  };
}
</script>

</body>
</html>
