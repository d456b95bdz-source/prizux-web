<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PRIZUX Deep Core — Relationship Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  padding: 60px 10% 140px;
  background: #fff;
  color: #111;
}

header {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  letter-spacing: 2px;
}

.logo {
  width: 22px;
  height: 22px;
  background: #111;
  border-radius: 6px;
}

.hero {
  margin-top: 100px;
  max-width: 760px;
}

.hero h1 {
  font-size: 48px;
}

.hero p {
  margin-top: 18px;
  font-size: 18px;
  color: #555;
}

.lab {
  margin-top: 100px;
  max-width: 820px;
  padding: 40px;
  border: 1px solid #eee;
  border-radius: 24px;
}

.section-title {
  font-size: 18px;
  margin-bottom: 20px;
}

.label-grid {
  display: grid;
  grid-template-columns: 1fr 120px 120px 40px 1fr 120px 120px;
  gap: 12px;
  margin-bottom: 30px;
}

.label-grid input,
.label-grid select {
  padding: 10px 14px;
  font-size: 14px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
}

.arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
}

.data-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.data-row input {
  width: 160px;
  padding: 10px 14px;
  font-size: 16px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
}

button {
  padding: 12px 26px;
  border-radius: 999px;
  border: none;
  background: #111;
  color: #fff;
  cursor: pointer;
}

.add-btn {
  margin-top: 10px;
  background: none;
  color: #4F46E5;
  border: none;
  cursor: pointer;
}

.result {
  margin-top: 40px;
  font-size: 18px;
}
</style>
</head>

<body>

<header>
  <div class="logo"></div>
  <span>PRIZUX</span>
</header>

<section class="hero">
  <h1>Relationship Lab</h1>
  <p>Train numerical relationships and test new inputs.</p>
</section>

<section class="lab">

  <div class="section-title">Labels & Units</div>

  <div class="label-grid">
    <input id="xLabel" placeholder="Input label" />
    <select id="xType">
      <option value="length">Length</option>
      <option value="mass">Mass</option>
      <option value="time">Time</option>
      <option value="money">Money</option>
    </select>
    <select id="xUnit">
      <option value="cm">cm</option>
      <option value="m">m</option>
      <option value="USD">USD</option>
      <option value="KRW">KRW</option>
    </select>

    <div class="arrow">→</div>

    <input id="yLabel" placeholder="Output label" />
    <select id="yType">
      <option value="money">Money</option>
      <option value="length">Length</option>
    </select>
    <select id="yUnit">
      <option value="USD">USD</option>
      <option value="KRW">KRW</option>
      <option value="cm">cm</option>
    </select>
  </div>

  <div class="section-title">Training Data</div>

  <div id="rows">
    <div class="data-row">
      <input class="xVal" placeholder="x" />
      <div class="arrow">→</div>
      <input class="yVal" placeholder="y" />
    </div>
  </div>

  <button class="add-btn" onclick="addRow()">+ Add data</button>

  <div style="margin-top:30px;">
    <button onclick="train()">Train</button>
  </div>

  <div style="margin-top:40px;">
    <input id="predictInput" placeholder="Test input" />
    <button onclick="predict()">Predict</button>
  </div>

  <div id="result" class="result"></div>

</section>

<script>
const API = "http://127.0.0.1:8000";

function addRow() {
  const row = document.createElement("div");
  row.className = "data-row";
  row.innerHTML = `
    <input class="xVal" placeholder="x" />
    <div class="arrow">→</div>
    <input class="yVal" placeholder="y" />
  `;
  document.getElementById("rows").appendChild(row);
}

async function train() {
  const xs = [...document.querySelectorAll(".xVal")].map(i => Number(i.value));
  const ys = [...document.querySelectorAll(".yVal")].map(i => Number(i.value));

  await fetch(API + "/train", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      x: xs,
      y: ys,
      x_type: xType.value,
      x_unit: xUnit.value,
      y_type: yType.value,
      y_unit: yUnit.value
    })
  });

  alert("Model trained");
}

async function predict() {
  const res = await fetch(API + "/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      x_value: Number(predictInput.value),
      x_type: xType.value,
      x_unit: xUnit.value,
      y_type: yType.value,
      y_unit: yUnit.value
    })
  });

  const data = await res.json();
  result.innerHTML = `Result: ${data.min.toFixed(2)} – ${data.max.toFixed(2)} ${data.unit}`;
}
</script>

</body>
</html>
