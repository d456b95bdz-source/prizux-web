<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PRIZUX Deep Core — Relationship Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  padding: 60px 10% 140px;
  background: #fff;
  color: #111;
}

header {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  letter-spacing: 2px;
}

.logo {
  width: 22px;
  height: 22px;
  background: #111;
  border-radius: 6px;
}

.hero {
  margin-top: 100px;
  max-width: 760px;
}

.hero h1 {
  font-size: 48px;
}

.hero p {
  margin-top: 18px;
  font-size: 18px;
  color: #555;
}

.lab {
  margin-top: 100px;
  max-width: 820px;
  padding: 40px;
  border: 1px solid #eee;
  border-radius: 24px;
}

.section-title {
  font-size: 18px;
  margin-bottom: 20px;
}

.data-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.data-row input {
  width: 160px;
  padding: 10px 14px;
  font-size: 16px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
}

.arrow {
  color: #888;
}

button {
  padding: 12px 26px;
  border-radius: 999px;
  border: none;
  background: #111;
  color: #fff;
  cursor: pointer;
}

.add-btn {
  margin-top: 10px;
  background: none;
  color: #4F46E5;
  border: none;
  cursor: pointer;
}

.result {
  margin-top: 30px;
  font-size: 20px;
  font-weight: 500;
}
</style>
</head>

<body>

<header>
  <div class="logo"></div>
  <span>PRIZUX</span>
</header>

<section class="hero">
  <h1>Relationship Lab</h1>
  <p>Train numerical relationships and test new inputs.</p>
</section>

<section class="lab">

  <div class="section-title">Training Data</div>

  <div id="rows">
    <div class="data-row">
      <input class="xVal" placeholder="x" />
      <div class="arrow">→</div>
      <input class="yVal" placeholder="y" />
    </div>
  </div>

  <button class="add-btn" onclick="addRow()">+ Add data</button>

  <div style="margin-top:30px;">
    <button onclick="train()">Train</button>
  </div>

  <div class="section-title" style="margin-top:60px;">Prediction</div>

  <div class="data-row">
    <input id="predictInput" placeholder="Input x" />
    <button onclick="predict()">Predict</button>
  </div>

  <div id="result" class="result"></div>

</section>

<script>
// ==============================
// API CONFIG
// ==============================
// 로컬 테스트
const API = "http://127.0.0.1:8000";

// 나중에 서버 올리면 ↓ 이것만 바꾸면 됨
// const API = "https://api.prizux.com";

// ==============================
// UI HELPERS
// ==============================
function addRow() {
  const row = document.createElement("div");
  row.className = "data-row";
  row.innerHTML = `
    <input class="xVal" placeholder="x" />
    <div class="arrow">→</div>
    <input class="yVal" placeholder="y" />
  `;
  document.getElementById("rows").appendChild(row);
}

// ==============================
// TRAIN
// ==============================
async function train() {
  const xs = [...document.querySelectorAll(".xVal")].map(i => Number(i.value));
  const ys = [...document.querySelectorAll(".yVal")].map(i => Number(i.value));

  const res = await fetch(API + "/api/train", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      x: xs,
      y: ys
    })
  });

  const data = await res.json();

  if (!res.ok) {
    alert("Train failed: " + data.detail);
    return;
  }

  alert(
    `Model trained\nw = ${data.weight.toFixed(4)}\nb = ${data.bias.toFixed(4)}`
  );
}

// ==============================
// PREDICT
// ==============================
async function predict() {
  const x = Number(document.getElementById("predictInput").value);

  const res = await fetch(API + "/api/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      x: x
    })
  });

  const data = await res.json();

  if (!res.ok) {
    document.getElementById("result").innerText =
      "Error: " + data.detail;
    return;
  }

  document.getElementById("result").innerText =
    `Prediction: y = ${data.prediction.toFixed(4)}`;
}
</script>

</body>
</html>
