<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PRIZUX Deep Core — Relationship Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  padding: 60px 10% 140px;
  background: #fff;
  color: #111;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  letter-spacing: 2px;
}

header a {
  text-decoration: none;
  color: #111;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 22px;
  height: 22px;
  background: #111;
  border-radius: 6px;
}

/* HERO */
.hero {
  margin-top: 120px;
  max-width: 760px;
}

.hero h1 {
  font-size: 52px;
  font-weight: 600;
}

.hero p {
  margin-top: 20px;
  font-size: 18px;
  color: #555;
  line-height: 1.6;
}

/* LAB */
.lab {
  margin-top: 120px;
  max-width: 820px;
  padding: 40px;
  border: 1px solid #eee;
  border-radius: 24px;
}

.section-title {
  font-size: 18px;
  margin-bottom: 20px;
}

/* LABEL + UNIT */
.label-grid {
  display: grid;
  grid-template-columns: 1fr 140px 120px 40px 1fr 140px 120px;
  gap: 12px;
  margin-bottom: 36px;
}

.label-grid input,
.label-grid select {
  padding: 10px 14px;
  font-size: 14px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
}

.arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
  font-size: 18px;
}

/* DATA ROW */
.data-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.data-row input {
  width: 160px;
  padding: 10px 14px;
  font-size: 16px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
}

/* ADD */
.add-btn {
  margin-top: 10px;
  background: none;
  border: none;
  color: #4F46E5;
  font-size: 15px;
  cursor: pointer;
}

/* ACTION */
.action {
  margin-top: 50px;
}

.action button {
  padding: 14px 32px;
  font-size: 16px;
  border-radius: 999px;
  border: none;
  background: #111;
  color: #fff;
  cursor: pointer;
}

/* NOTE */
.note {
  margin-top: 120px;
  font-size: 14px;
  color: #777;
  max-width: 760px;
}

/* MOBILE */
@media (max-width: 900px) {
  .label-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <a href="/core.html">
    <div class="logo"></div>
    <span>PRIZUX</span>
  </a>
</header>

<section class="hero">
  <h1>Relationship Lab</h1>
  <p>
    Define labels and units.<br>
    Train a model to learn numerical relationships.
  </p>
</section>

<section class="lab">

  <div class="section-title">Labels & Units</div>

  <div class="label-grid">
    <!-- INPUT -->
    <input placeholder="Input label" />
    <select onchange="updateUnits(this, 'inputUnit')">
      <option value="">Type</option>
      <option value="count">Count</option>
      <option value="length">Length</option>
      <option value="mass">Mass</option>
      <option value="force">Force</option>
      <option value="time">Time</option>
      <option value="velocity">Velocity</option>
      <option value="acceleration">Acceleration</option>
      <option value="money">Money</option>
    </select>
    <select id="inputUnit">
      <option value="">Unit</option>
    </select>

    <div class="arrow">→</div>

    <!-- OUTPUT -->
    <input placeholder="Output label" />
    <select onchange="updateUnits(this, 'outputUnit')">
      <option value="">Type</option>
      <option value="count">Count</option>
      <option value="length">Length</option>
      <option value="mass">Mass</option>
      <option value="force">Force</option>
      <option value="time">Time</option>
      <option value="velocity">Velocity</option>
      <option value="acceleration">Acceleration</option>
      <option value="money">Money</option>
    </select>
    <select id="outputUnit">
      <option value="">Unit</option>
    </select>
  </div>

  <div class="section-title">Data Points</div>

  <div id="rows">
    <div class="data-row">
      <input type="number" placeholder="Input value" />
      <div class="arrow">→</div>
      <input type="number" placeholder="Output value" />
    </div>
  </div>

  <button class="add-btn" onclick="addRow()">+ Add data point</button>

  <div class="action">
    <button>Train Relationship</button>
  </div>

</section>

<div class="note">
Units provide structural context without enforcing semantic interpretation.
</div>

<script>
const unitMap = {
  count: ["count", "items"],
  length: ["mm", "cm", "m", "km"],
  mass: ["g", "kg", "t"],
  force: ["N", "kN"],
  time: ["ms", "s", "min", "h"],
  velocity: ["m/s", "km/h"],
  acceleration: ["m/s²"],
  money: ["KRW (₩)", "USD ($)", "CNY (¥)", "JPY (¥)", "EUR (€)"]
};

function updateUnits(select, targetId) {
  const unitSelect = document.getElementById(targetId);
  unitSelect.innerHTML = '<option value="">Unit</option>';
  const units = unitMap[select.value] || [];
  units.forEach(u => {
    const opt = document.createElement("option");
    opt.value = u;
    opt.textContent = u;
    unitSelect.appendChild(opt);
  });
}

function addRow() {
  const rows = document.getElementById("rows");
  const row = document.createElement("div");
  row.className = "data-row";
  row.innerHTML = `
    <input type="number" placeholder="Input value" />
    <div class="arrow">→</div>
    <input type="number" placeholder="Output value" />
  `;
  rows.appendChild(row);
}
</script>

</body>
</html>
