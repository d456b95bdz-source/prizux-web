<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PRIZUX Deep Core Lab</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  padding: 60px 10%;
}

.card {
  border: 1px solid #eee;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}

input {
  padding: 10px;
  width: 100px;
  margin-right: 6px;
}

button {
  padding: 12px 24px;
  border-radius: 999px;
  background: #111;
  color: white;
  border: none;
}

.progress {
  height: 10px;
  background: #eee;
  border-radius: 5px;
  margin-top: 20px;
}

.bar {
  height: 100%;
  width: 0%;
  background: #4F46E5;
}
</style>
</head>

<body>

<h1>Deep Core Lab</h1>

<div id="data"></div>
<button onclick="addRow()">+ Add Row</button>

<br><br>
<button onclick="train()">Train</button>

<div class="progress"><div class="bar" id="bar"></div></div>

<div id="chart" style="height:400px;"></div>
<div id="loss3d" style="height:500px;"></div>

<script>
const API = location.origin;
let rows = [];

function addRow() {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    X: <input type="number"> <input type="number">
    Y: <input type="number">
  `;
  document.getElementById("data").appendChild(div);
}

async function train() {
  const cards = document.querySelectorAll(".card");
  let X = [], Y = [];

  cards.forEach(c => {
    const inputs = c.querySelectorAll("input");
    X.push([Number(inputs[0].value), Number(inputs[1].value)]);
    Y.push(Number(inputs[2].value));
  });

  let bar = document.getElementById("bar");
  bar.style.width = "30%";

  const res = await fetch(API + "/api/train", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({X, Y})
  });

  const data = await res.json();
  bar.style.width = "100%";

  Plotly.newPlot("chart", [{
    y: data.loss_history,
    type: "scatter"
  }]);

  const traj = data.trajectory;
  Plotly.newPlot("loss3d", [{
    x: traj.map(t => t.w),
    y: traj.map(t => t.b),
    z: traj.map(t => t.loss),
    mode: "lines+markers",
    type: "scatter3d"
  }]);
}
</script>

</body>
</html>
