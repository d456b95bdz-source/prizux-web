<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PRIZUX Deep Core Lab</title>
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>
body { font-family:-apple-system; padding:60px 10%; }
.card { border:1px solid #eee; border-radius:20px; padding:30px; margin-bottom:40px; }
input { padding:10px; width:90px; margin-right:6px; }
button { padding:12px 24px; border-radius:999px; background:#111; color:#fff; border:none; }
.progress { height:8px; background:#eee; border-radius:6px; overflow:hidden; }
.bar { height:100%; width:0%; background:#4F46E5; }
</style>
</head>

<body>

<h1>Deep Core Relationship Lab</h1>

<div class="card">
<h3>Training Data</h3>
<div id="rows"></div>
<button onclick="addRow()">+ Add X row</button>
<br><br>
<label>Y value per row</label>
<input type="number" id="yval">
</div>

<div class="card">
<label>Epochs</label>
<input type="number" id="epochs" value="100">
<button onclick="train()">Train</button>
<div class="progress"><div class="bar" id="bar"></div></div>
<p id="loss"></p>
</div>

<div class="card">
<h3>Predict</h3>
<div id="predictX"></div>
<button onclick="predict()">Predict</button>
<h2 id="result"></h2>
</div>

<div id="plot" style="height:500px;"></div>

<script>
const API = "/api";
const session = Math.random().toString(36).slice(2);

function addRow(){
  const row = document.createElement("div");
  row.innerHTML = `
    <input type="number" class="x">
    <input type="number" class="x">
  `;
  document.getElementById("rows").appendChild(row);
}

function collectX(){
  return [...document.querySelectorAll("#rows div")]
    .map(r=>[...r.querySelectorAll(".x")].map(i=>Number(i.value)));
}

async function train(){
  const X = collectX();
  const Y = X.map(()=>Number(yval.value));

  const res = await fetch(API+"/train",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session_id:session,X,Y,epochs:Number(epochs.value)})
  });

  const data = await res.json();

  Plotly.newPlot("plot",[{
    x:data.loss_history.map((_,i)=>i),
    y:data.loss_history,
    type:"scatter"
  }]);
}

function predict(){
  const x = [...document.querySelectorAll("#rows div")[0]
    .querySelectorAll(".x")].map(i=>Number(i.value));

  fetch(API+"/predict",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session_id:session,x})
  })
  .then(r=>r.json())
  .then(d=>{
    result.innerText = "Prediction: " + d.prediction.toFixed(4);
  });
}
</script>

</body>
</html>
