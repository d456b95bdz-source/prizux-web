<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRIZUX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== BASE ===== */
body {
  margin: 0;
  padding: 80px 10%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #111;
  background: #fff;
}

/* ===== HEADER ===== */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
  letter-spacing: 2px;
}

.logo {
  width: 24px;
  height: 24px;
  background: #111;
  border-radius: 6px;
}

/* ===== HERO ===== */
.hero {
  margin-top: 120px;
  max-width: 800px;
}

.hero h1 {
  font-size: 64px;
  line-height: 1.05;
  font-weight: 600;
}

.hero p {
  margin-top: 24px;
  font-size: 20px;
  color: #555;
  line-height: 1.6;
}

/* ===== ACTION ===== */
.actions {
  margin-top: 40px;
}

.actions a {
  display: inline-block;
  padding: 14px 28px;
  border-radius: 999px;
  background: #111;
  color: #fff;
  text-decoration: none;
  font-size: 15px;
  transition: transform .2s ease, box-shadow .2s ease;
}

.actions a:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  body {
    padding: 60px 8%;
  }

  .hero h1 {
    font-size: 48px;
  }

  .hero p {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo"></div>
  <span>PRIZUX</span>
</header>

<section class="hero">
  <h1>
    Numerical<br>
    Intelligence
  </h1>

  <p>
    PRIZUX is a system that learns numerical relationships.<br>
    PRIZUX introduces a new approach to learning numerical relationships,
    beyond conventional numerical AI systems.
  </p>

  <div class="actions">
    <a href="core.html">Explore Core</a>
  </div>
</section>

</body>
</html>
